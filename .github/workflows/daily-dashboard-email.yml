name: Daily Dashboard Email

on:
  workflow_dispatch: {}   # triggered externally via GitHub API for exact-time delivery (see cron-job.org setup)
  # NOTE: no `schedule:` trigger here on purpose. GitHub's own scheduler has shown
  # multi-hour delays (up to ~7 hours observed), so exact-time delivery is handled
  # by an external trigger (cron-job.org) calling this workflow's dispatch API
  # instead. Do not add a schedule: block back here without removing the
  # external trigger first, or you'll get duplicate emails again.

jobs:
  send-dashboard-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit the regenerated dashboard back to the repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl playwright requests
          playwright install --with-deps chromium

      - name: Regenerate dashboard from latest Excel data (safety net)
        run: python scripts/generate_dashboard.py

      - name: Commit updated dashboard (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-regenerate dashboard before daily email"
          git push

      - name: Take dashboard screenshot
        run: python scripts/screenshot.py

      - name: Send email with embedded screenshot
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python scripts/send_email.py
