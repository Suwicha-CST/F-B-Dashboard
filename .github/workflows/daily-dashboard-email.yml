name: Daily Dashboard Email

on:
  schedule:
    # 06:47 UTC = 13:47 Bangkok time (UTC+7), Monday-Friday only.
    # Deliberately NOT on the hour (:00) - GitHub Actions sees the heaviest
    # scheduling congestion right at the top of each hour, which was causing
    # multi-hour delays. Aiming ~13 minutes early gives it a real chance to
    # land closer to 2 PM even with some platform delay.
    - cron: '47 6 * * 1-5'
  workflow_dispatch: {}   # lets you manually trigger a test run from the Actions tab

jobs:
  send-dashboard-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit the regenerated dashboard back to the repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl playwright requests
          playwright install --with-deps chromium

      - name: Regenerate dashboard from latest Excel data (safety net)
        run: python scripts/generate_dashboard.py

      - name: Commit updated dashboard (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-regenerate dashboard before daily email"
          git push

      - name: Take dashboard screenshot
        run: python scripts/screenshot.py

      - name: Send email with embedded screenshot
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python scripts/send_email.py
