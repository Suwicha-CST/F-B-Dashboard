name: Regenerate Dashboard on Data Update

on:
  push:
    paths:
      - 'F_B_Master_Database.xlsx'   # only runs when this specific file changes
  workflow_dispatch: {}              # lets you manually trigger it too

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Regenerate dashboard from latest Excel data
        run: python scripts/generate_dashboard.py

      - name: Commit updated dashboard (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-regenerate dashboard from updated Excel data"
          git push
